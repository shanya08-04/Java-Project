<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101917">
  <meta name="description" content="A polished browser version of the classic Snake game.">
  <title>Snake // Arcade Garden</title>
  <style>
    :root {
      --ink: #edf3e8;
      --muted: #9eafa2;
      --panel: rgba(18, 31, 27, 0.86);
      --panel-border: rgba(211, 235, 179, 0.16);
      --lime: #c9f36b;
      --lime-dark: #829f36;
      --coral: #ff806d;
      --canvas: #12231f;
      --focus: #f9d36d;
      --shadow: rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 8%, rgba(201, 243, 107, 0.12), transparent 31rem),
        radial-gradient(circle at 90% 92%, rgba(255, 128, 109, 0.09), transparent 26rem),
        linear-gradient(135deg, #0d1715 0%, #14241f 56%, #111c1a 100%);
      font-family: Georgia, 'Times New Roman', serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: '';
      opacity: .22;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    button { font: inherit; }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 38px;
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--lime);
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 680px;
      margin: 0;
      color: #f4f7e9;
      font-size: clamp(2.7rem, 8vw, 5.8rem);
      font-weight: 700;
      line-height: .88;
      letter-spacing: -.045em;
    }

    .intro {
      max-width: 255px;
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      align-items: start;
      gap: 24px;
    }

    .board-wrap {
      position: relative;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 14px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: rgba(8, 15, 14, .58);
      box-shadow: 0 22px 60px var(--shadow), inset 0 1px rgba(255,255,255,.04);
    }

    .canvas-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid rgba(201, 243, 107, .2);
      background: var(--canvas);
      touch-action: none;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 2px 0;
      color: var(--muted);
      font: 12px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .status-line strong { color: var(--lime); font-weight: 700; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(8, 15, 14, .76);
      text-align: center;
    }

    .overlay[hidden] { display: none; }

    .overlay-card { max-width: 300px; }
    .overlay-card p { margin: 10px 0 20px; color: var(--muted); line-height: 1.45; }
    .overlay-card h2 { margin: 0; color: var(--coral); font-size: clamp(2.1rem, 7vw, 3.6rem); line-height: .95; }
    .overlay-card h2.paused { color: var(--lime); }

    .button {
      min-height: 44px;
      padding: 9px 16px;
      border: 1px solid rgba(201, 243, 107, .5);
      border-radius: 4px;
      color: #111a15;
      background: var(--lime);
      cursor: pointer;
      font: 700 13px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .04em;
      text-transform: uppercase;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .button:hover { background: #e0ff91; box-shadow: 0 8px 22px rgba(201,243,107,.17); transform: translateY(-1px); }
    .button:active { transform: translateY(1px); }
    .button.secondary { color: var(--ink); background: transparent; border-color: var(--panel-border); }
    .button.secondary:hover { background: rgba(255,255,255,.07); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .sidebar { display: grid; gap: 16px; }

    .panel {
      padding: 20px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 38px var(--shadow);
    }

    .panel-label {
      margin: 0 0 16px;
      color: var(--muted);
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .score-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .score { color: var(--lime); font-size: 4.2rem; line-height: .85; }
    .high-score { color: var(--muted); font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; }
    .high-score strong { display: block; color: var(--ink); font-size: 18px; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
    .actions .button { width: 100%; }

    .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; max-width: 150px; margin: 0 auto; }
    .key { display: grid; place-items: center; min-height: 36px; border: 1px solid var(--panel-border); border-radius: 3px; color: var(--muted); background: rgba(255,255,255,.04); font: 700 14px/1 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .key.up { grid-column: 2; }
    .key.left { grid-column: 1; }
    .key.down { grid-column: 2; }
    .key.right { grid-column: 3; grid-row: 2; }

    .note { margin: 16px 0 0; color: var(--muted); font-size: .95rem; line-height: 1.5; }
    .note strong { color: var(--ink); }

    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 620px); padding-top: 28px; }
      .masthead { display: block; margin-bottom: 22px; }
      .intro { max-width: 420px; margin-top: 14px; }
      .game-layout { display: block; }
      .sidebar { grid-template-columns: 1fr 1fr; margin-top: 18px; }
      .panel:last-child { grid-column: 1 / -1; }
    }

    @media (max-width: 460px) {
      .shell { width: calc(100% - 16px); }
      .board-wrap { padding: 8px; }
      .sidebar { grid-template-columns: 1fr; }
      .panel:last-child { grid-column: auto; }
      .status-line { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="kicker">Arcade / 01</p>
        <h1>Snake<br>Garden</h1>
      </div>
      <p class="intro">A small, sharp game of timing. Grow the line. Keep your head clear.</p>
    </header>

    <section class="game-layout" aria-label="Snake game">
      <div class="board-wrap">
        <div class="canvas-frame" id="board-area">
          <canvas id="game" width="600" height="600" aria-label="Snake game board"></canvas>
          <div class="overlay" id="overlay" hidden>
            <div class="overlay-card">
              <h2 id="overlay-title">Game over</h2>
              <p id="overlay-copy">Your run ended at the edge of the garden.</p>
              <button class="button" id="overlay-action" type="button">Play again</button>
            </div>
          </div>
        </div>
        <div class="status-line"><span>Run status: <strong id="status">Live</strong></span><span>100ms pulse</span></div>
      </div>

      <aside class="sidebar">
        <div class="panel">
          <p class="panel-label">Current run</p>
          <div class="score-row">
            <div class="score" id="score">0</div>
            <div class="high-score">Best score<strong id="best-score">0</strong></div>
          </div>
          <div class="actions">
            <button class="button" id="restart" type="button">↻ Restart</button>
            <button class="button secondary" id="pause" type="button">Ⅱ Pause</button>
          </div>
        </div>

        <div class="panel">
          <p class="panel-label">Steer</p>
          <div class="keys" aria-hidden="true">
            <span class="key up">↑</span><span class="key left">←</span><span class="key down">↓</span><span class="key right">→</span>
          </div>
          <p class="note"><strong>Arrows</strong> or <strong>WASD</strong> on desktop. Swipe anywhere on the board on mobile.</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const context = canvas.getContext('2d');
      const boardArea = document.getElementById('board-area');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayCopy = document.getElementById('overlay-copy');
      const overlayAction = document.getElementById('overlay-action');
      const scoreElement = document.getElementById('score');
      const bestScoreElement = document.getElementById('best-score');
      const statusElement = document.getElementById('status');
      const pauseButton = document.getElementById('pause');
      const gridSize = 25;
      const tileCount = canvas.width / gridSize;
      const tickRate = 100;
      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      let snake;
      let food;
      let direction;
      let queuedDirection;
      let score;
      let gameState = 'playing';
      let timer;
      let touchStart = null;
      let bestScore = Number(localStorage.getItem('snake-best-score') || 0);
      bestScoreElement.textContent = bestScore;

      function startGame() {
        snake = [{ x: 4, y: 4 }, { x: 3, y: 4 }, { x: 2, y: 4 }];
        direction = directions.right;
        queuedDirection = direction;
        score = 0;
        gameState = 'playing';
        placeFood();
        updateHud();
        hideOverlay();
        clearInterval(timer);
        timer = setInterval(step, tickRate);
        draw();
      }

      function placeFood() {
        do {
          food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
        } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
      }

      function setDirection(nextDirection) {
        if (gameState === 'over') return;
        const next = directions[nextDirection];
        if (next.x + direction.x === 0 && next.y + direction.y === 0) return;
        queuedDirection = next;
        if (gameState === 'paused') togglePause();
      }

      function step() {
        if (gameState !== 'playing') return;
        direction = queuedDirection;
        const head = snake[0];
        const nextHead = { x: head.x + direction.x, y: head.y + direction.y };
        const hitWall = nextHead.x < 0 || nextHead.x >= tileCount || nextHead.y < 0 || nextHead.y >= tileCount;
        const ateFood = nextHead.x === food.x && nextHead.y === food.y;
        const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
        const hitSelf = bodyToCheck.some(segment => segment.x === nextHead.x && segment.y === nextHead.y);

        if (hitWall || hitSelf) {
          endGame();
          return;
        }

        snake.unshift(nextHead);
        if (ateFood) {
          score += 1;
          placeFood();
        } else {
          snake.pop();
        }
        updateHud();
        draw();
      }

      function endGame() {
        gameState = 'over';
        clearInterval(timer);
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('snake-best-score', String(bestScore));
        }
        updateHud();
        overlayTitle.textContent = 'Game over';
        overlayTitle.classList.remove('paused');
        overlayCopy.textContent = `You scored ${score}. The garden is waiting for another run.`;
        overlayAction.textContent = 'Play again';
        overlay.hidden = false;
        draw();
      }

      function togglePause() {
        if (gameState === 'over') return;
        if (gameState === 'playing') {
          gameState = 'paused';
          clearInterval(timer);
          overlayTitle.textContent = 'Paused';
          overlayTitle.classList.add('paused');
          overlayCopy.textContent = 'Take a breath. Your run is held right here.';
          overlayAction.textContent = 'Resume';
          overlay.hidden = false;
        } else {
          gameState = 'playing';
          timer = setInterval(step, tickRate);
          hideOverlay();
        }
        updateHud();
      }

      function hideOverlay() { overlay.hidden = true; }

      function updateHud() {
        scoreElement.textContent = score;
        bestScoreElement.textContent = Math.max(bestScore, score);
        statusElement.textContent = gameState === 'playing' ? 'Live' : gameState === 'paused' ? 'Paused' : 'Ended';
        pauseButton.textContent = gameState === 'paused' ? '▶ Resume' : 'Ⅱ Pause';
        pauseButton.disabled = gameState === 'over';
        pauseButton.style.opacity = gameState === 'over' ? '.5' : '1';
      }

      function draw() {
        context.fillStyle = '#12231f';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.strokeStyle = 'rgba(201, 243, 107, .06)';
        context.lineWidth = 1;
        for (let index = 1; index < tileCount; index += 1) {
          const position = index * gridSize + .5;
          context.beginPath(); context.moveTo(position, 0); context.lineTo(position, canvas.height); context.stroke();
          context.beginPath(); context.moveTo(0, position); context.lineTo(canvas.width, position); context.stroke();
        }

        drawFood();
        snake.forEach((segment, index) => {
          const inset = index === 0 ? 2 : 3;
          const x = segment.x * gridSize + inset;
          const y = segment.y * gridSize + inset;
          context.fillStyle = index === 0 ? '#e1ff84' : `rgb(${133 - Math.min(index, 45)}, ${185 - Math.min(index, 45)}, ${63 + Math.min(index, 25)})`;
          context.fillRect(x, y, gridSize - inset * 2, gridSize - inset * 2);
          if (index === 0) drawEyes(x, y);
        });
      }

      function drawFood() {
        const x = food.x * gridSize + gridSize / 2;
        const y = food.y * gridSize + gridSize / 2;
        context.fillStyle = '#ff806d';
        context.beginPath(); context.arc(x, y, 8, 0, Math.PI * 2); context.fill();
        context.fillStyle = '#f9d36d';
        context.fillRect(x + 3, y - 10, 3, 5);
      }

      function drawEyes(x, y) {
        context.fillStyle = '#13221c';
        const eyeOffset = direction === directions.left ? 5 : direction === directions.right ? 13 : 9;
        const eyeY = direction === directions.up ? 5 : direction === directions.down ? 13 : 9;
        context.fillRect(x + eyeOffset, y + eyeY, 3, 3);
        context.fillRect(x + eyeOffset + (direction.y ? 7 : 0), y + eyeY + (direction.x ? 7 : 0), 3, 3);
      }

      function handleKey(event) {
        const keys = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
        if (keys[event.key]) { event.preventDefault(); setDirection(keys[event.key]); }
        if (event.key === ' ' || event.key === 'p' || event.key === 'P') { event.preventDefault(); togglePause(); }
        if (event.key === 'Enter' && gameState === 'over') startGame();
      }

      function handleTouchStart(event) { touchStart = event.changedTouches[0]; }
      function handleTouchEnd(event) {
        if (!touchStart) return;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.clientX;
        const dy = touch.clientY - touchStart.clientY;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        setDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      }

      document.addEventListener('keydown', handleKey);
      boardArea.addEventListener('touchstart', handleTouchStart, { passive: true });
      boardArea.addEventListener('touchend', handleTouchEnd, { passive: true });
      document.getElementById('restart').addEventListener('click', startGame);
      pauseButton.addEventListener('click', togglePause);
      overlayAction.addEventListener('click', () => gameState === 'paused' ? togglePause() : startGame());
      startGame();
    })();
  </script>
</body>
</html>
